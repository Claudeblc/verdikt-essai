<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdikt · essai</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<script type="module" src="essai.js"></script>
<style>
  :root {
    --fond: #0b1017; --panneau: #131b26; --panneau2: #18222f; --ligne: #2a3546;
    --texte: #e8edf4; --doux: #93a0b2; --encre: #93a9ff; --tampon: #ff8a5c;
    --ok: #4fc68c; --alerte: #e3a83c; --refus: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.5 "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; }
  .bandeau { background: var(--panneau2); border-bottom: 1px solid var(--ligne); padding: 10px 16px; font-size: 14px; color: var(--doux); text-align: center; }
  .bandeau b { color: var(--alerte); font-weight: 600; }
  header { max-width: 1180px; margin: 0 auto; padding: 24px 16px 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: -0.3px; }
  header p { margin: 0; color: var(--doux); }
  .grille { max-width: 1180px; margin: 0 auto; padding: 8px 16px 48px; display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
  @media (max-width: 820px) { .grille { grid-template-columns: minmax(0, 1fr); } nav { min-width: 0; } nav ol { display: flex; overflow-x: auto; gap: 8px; } nav li { flex: 0 0 auto; } }
  nav ol { list-style: none; margin: 0; padding: 0; }
  .rapport { overflow-x: auto; }
  nav li { padding: 10px 12px; border-radius: 8px; color: var(--doux); border-left: 3px solid transparent; }
  nav li.fait { color: var(--ok); }
  nav li.fait::before { content: "✓ "; }
  nav li.actif { color: var(--texte); background: var(--panneau); border-left-color: var(--tampon); font-weight: 600; }
  main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; }
  .carte { background: var(--panneau); border: 1px solid var(--ligne); border-radius: 12px; padding: 20px 22px; }
  .carte h2 { margin: 0 0 12px; font-size: 22px; }
  .carte h3 { margin: 18px 0 8px; font-size: 16px; color: var(--doux); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
  .guide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; border-color: var(--encre); }
  @media (max-width: 820px) { .guide { grid-template-columns: 1fr; } }
  .guide div span { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--encre); margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--ligne); vertical-align: top; }
  th { color: var(--doux); font-weight: 500; font-size: 13px; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.retenue td { background: rgba(79,198,140,0.08); }
  tr.veto td { color: var(--doux); text-decoration: line-through; text-decoration-color: var(--refus); }
  .defile { overflow-x: auto; }
  .pastille { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .p-ok { color: var(--ok); } .p-alerte { color: var(--alerte); } .p-refus { color: var(--refus); } .p-doux { color: var(--doux); } .p-encre { color: var(--encre); }
  .encart { border-radius: 10px; padding: 14px 16px; margin-top: 10px; }
  .encart.alerte { background: rgba(227,168,60,0.12); border: 1px solid var(--alerte); }
  .encart.refus { background: rgba(255,107,107,0.12); border: 1px solid var(--refus); }
  .encart.ok { background: rgba(79,198,140,0.10); border: 1px solid var(--ok); }
  ul.simple { margin: 6px 0 0; padding-left: 20px; }
  form { display: grid; gap: 12px; margin-top: 8px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--doux); }
  input, select, textarea { font: inherit; color: var(--texte); background: var(--fond); border: 1px solid var(--ligne); border-radius: 8px; padding: 9px 11px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
  fieldset { border: 1px solid var(--ligne); border-radius: 10px; padding: 12px 14px; margin: 0; }
  legend { padding: 0 6px; color: var(--texte); }
  .choix { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .choix label { display: flex; align-items: center; gap: 8px; color: var(--texte); background: var(--panneau2); border: 1px solid var(--ligne); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .boutons { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--ligne); background: var(--panneau2); color: var(--texte); }
  button.principal { background: #fff; color: #0b1017; border-color: #fff; }
  button.danger { color: var(--refus); border-color: var(--refus); background: transparent; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .message { border-radius: 10px; padding: 12px 16px; }
  .message.ok { background: rgba(79,198,140,0.12); border: 1px solid var(--ok); }
  .message.erreur { background: rgba(255,107,107,0.12); border: 1px solid var(--refus); }
  pre { white-space: pre-wrap; font: 13px/1.5 "IBM Plex Mono", ui-monospace, Consolas, monospace; color: var(--doux); margin: 10px 0 0; }
  .rapport { background: #f4f1ea; color: #1c232d; border-radius: 8px; padding: 22px 26px; }
  .rapport h1 { font-size: 22px; margin: 0 0 12px; } .rapport h2 { font-size: 17px; margin: 18px 0 6px; }
  .rapport table td, .rapport table th { border-color: #d8d2c4; color: #1c232d; }
  details summary { cursor: pointer; color: var(--doux); }
  .chiffre { font-size: 30px; font-weight: 700; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpis .carte { padding: 14px 16px; }
  .kpis small { color: var(--doux); display: block; }
</style>
</head>
<body>
<div class="bandeau"><b>Environnement d'essai</b> · dossier fictif « Cabinet Duval » · réponses d'agents enregistrées à l'avance · aucun appel à un modèle, aucune dépense · tout se passe dans votre navigateur</div>
<header>
  <h1>Verdikt</h1>
  <p>Faut-il vraiment investir dans ce projet d'IA ? Jouez la décision de bout en bout.</p>
</header>
<div class="grille">
  <nav aria-label="Étapes"><ol id="etapes"></ol></nav>
  <main id="principal" aria-live="polite"><div class="carte">Chargement…</div></main>
</div>
<script src="page.js"></script>
</body>
</html>
